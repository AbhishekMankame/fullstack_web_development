<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif; 
            /*Here it will first try to add Arial as the font, if that font is not found in the server/machine then it will try Helvetica, if that is also not found then it will fallback to sans-serif*/
            background-color: #1a1a1a;
            margin: 0;
            padding:0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        
        }

        .card {
            background-color: #d5d4d4;
            border-radius: 8px;
            padding: 30px; /* padding creates space inside an element, between its content and its border.*/
            width: 300px;
        }

        h2 {
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            background-color: #d8d8d8;
            border: 1px solid black;
        }

        button {
            background-color: #1b81da;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
        }

        button:hover {
            background-color: #0c51d0;
        }

        /*Note: flex property runs on the parent element.*/
    </style>
    
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form>
            <input type="email" name="" id="" placeholder="Email">
            <input type="password" name="" id="" placeholder="Password">
            <button type="submit">Login</button>
        </form>
    </div>
    
</body>
</html>
